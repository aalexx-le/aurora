apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: xela-test

resources:
  - ../../base
  - namespace.yaml

patchesStrategicMerge:
  - patches/replicas.yaml
  - patches/resource-limits.yaml

configMapGenerator:
  - name: xela-config
    behavior: merge
    literals:
      - NODE_ENV=test
      - LOG_LEVEL=info

secretGenerator:
  - name: xela-secrets
    behavior: merge
    envs:
      - .env.test 