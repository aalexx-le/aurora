apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: xela
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ${REGISTRY_URL}/server:latest
        ports:
        - containerPort: 5001
        envFrom:
        - configMapRef:
            name: xela-config
        - secretRef:
            name: xela-secrets
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: xela-secrets
              key: DATABASE_URL
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: xela-config
              key: NODE_ENV
        - name: MESSAGE_BROKER_URL
          value: "message-broker:9092"
        - name: SUBSCRIPTION_PATH
          valueFrom:
            secretKeyRef:
              name: xela-secrets
              key: SUBSCRIPTION_PATH
        - name: OTP_KEY
          valueFrom:
            secretKeyRef:
              name: xela-secrets
              key: OTP_KEY
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: xela-secrets
              key: JWT_SECRET
        - name: JWT_AT_EXP_TIME
          valueFrom:
            secretKeyRef:
              name: xela-secrets
              key: JWT_AT_EXP_TIME
        - name: JWT_RT_EXP_TIME
          valueFrom:
            secretKeyRef:
              name: xela-secrets
              key: JWT_RT_EXP_TIME
        - name: BANK_API_URL
          valueFrom:
            secretKeyRef:
              name: xela-secrets
              key: BANK_API_URL
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xela-secrets
              key: REDIS_PASSWORD
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 20 