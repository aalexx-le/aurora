stages:
  - test
  - build
  - deploy

variables:
  KUBECONFIG: /etc/deploy/config

# Include existing build jobs
include:
  - local: .gitlab-ci.yml

# Deploy to dev environment
deploy-dev:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - mkdir -p /etc/deploy
    - echo "$KUBE_CONFIG_DEV" > $KUBECONFIG
    - cd k8s
    - ./deploy.sh dev
  environment:
    name: development
    url: https://dev.xela.app
  only:
    - dev
  needs:
    - build-backend-dev
    - build-frontend-dev
    - build-crypto-pipeline-dev
    - build-embedding-consumer-dev
    - build-crypto-portfolio-consumer-dev
    - build-ai-server-dev

# Deploy to test environment
deploy-test:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - mkdir -p /etc/deploy
    - echo "$KUBE_CONFIG_TEST" > $KUBECONFIG
    - cd k8s
    - ./deploy.sh test
  environment:
    name: testing
    url: https://test.xela.app
  only:
    - tags
  when: manual
  needs:
    - build-backend-dev
    - build-frontend-dev
    - build-crypto-pipeline-dev
    - build-embedding-consumer-dev
    - build-crypto-portfolio-consumer-dev
    - build-ai-server-dev

# Deploy to production environment
deploy-prod:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - mkdir -p /etc/deploy
    - echo "$KUBE_CONFIG_PROD" > $KUBECONFIG
    - cd k8s
    - ./deploy.sh prod
  environment:
    name: production
    url: https://xela.app
  only:
    - main
  when: manual
  needs:
    - build-backend-prod
    - build-frontend-prod
    - build-crypto-pipeline-prod
    - build-embedding-consumer-prod
    - build-crypto-portfolio-consumer-prod
    - build-ai-server-prod 