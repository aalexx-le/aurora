  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 22181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:22181"
    restart: unless-stopped
    networks:
      - xela
    # logging:
    #   driver: "gelf"
    #   options:
    #     gelf-address: "udp://logstash:5000"
    #     tag: "zookeeper"

  message_broker:
    image: confluentinc/cp-kafka:7.3.0
    container_name: message_broker
    ports:
      - "29091:29091"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:22181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29091,PLAINTEXT_INTERNAL://message_broker:${MESSAGE_BROKER_PORT},PLAINTEXT_EXTERNAL://host.docker.internal:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_ADVERTISED_HOST_NAME: message_broker
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    restart: unless-stopped
    networks:
      - xela
    # logging:
    #   driver: "gelf"
    #   options:
    #     gelf-address: "udp://logstash:5000"
    #     tag: "message_broker"

  kafka_ui:
    image: provectuslabs/kafka-ui
    hostname: kafka_ui
    container_name: kafka_ui
    restart: always
    ports:
      - '8000:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: message_broker:${MESSAGE_BROKER_PORT}
      KAFKA_BROKERCONNECT: message_broker:${MESSAGE_BROKER_PORT}
    depends_on:
      - message_broker
      - zookeeper
    networks:
      - xela
    # logging:
    #   driver: "gelf"
    #   options:
    #     gelf-address: "udp://logstash:5000"
    #     tag: "kafka_ui"

