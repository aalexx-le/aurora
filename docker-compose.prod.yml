  vector-store:
    container_name: vector-store
    image: bitnami/elasticsearch:latest
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 3
    volumes:
      - vector-stores-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - xela

  vector-store-kibana:
    container_name: vector-store-kibana
    image: bitnami/kibana:latest
    environment:
      KIBANA_ELASTICSEARCH_URL: "vector-store"
    ports:
      - "5601:5601"
    depends_on:
      - vector-store
    restart: unless-stopped
    networks:
      - xela

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 22181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:22181"
    restart: unless-stopped
    networks:
      - xela

  message_broker:
    image: confluentinc/cp-kafka:7.3.0
    container_name: message_broker
    ports:
      - "29091:29091"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:22181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29091,PLAINTEXT_INTERNAL://message_broker:${MESSAGE_BROKER_PORT}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_ADVERTISED_HOST_NAME: message_broker
    restart: unless-stopped
    networks:
      - xela

  kafka_ui:
    image: provectuslabs/kafka-ui
    hostname: kafka_ui
    container_name: kafka_ui
    restart: always
    ports:
      - '8000:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: message_broker:${MESSAGE_BROKER_PORT}
      KAFKA_BROKERCONNECT: message_broker:${MESSAGE_BROKER_PORT}
    depends_on:
      - message_broker
      - zookeeper
    networks:
      - xela

volumes:
  mongodb:
  mongoconfig:
  timeseries-data:
  vector-stores-data:

networks:
  xela:
    name: xela-network
    driver: bridge