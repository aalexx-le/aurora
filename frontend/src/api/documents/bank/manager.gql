query GetBankManagers {
    getBankManagers {
        id
        name
        createdAt
        updatedAt
        autoBankManager {
            thirdParty
        }
        banks {
            name
            accountName
            accountNumber
            balance
            createdAt
            updatedAt
            historicalBalances {
                balance
                time
            }
            transactions {
                id
                bank {
                    name
                }
                amount
                spentAmount
                description
                createdAt
            }
        }
    }
}

mutation CreateBankManager($data: CreateBankManagerInput!) {
    createBankManager(data: $data) {
        id
        name
        createdAt
    }
}